name: Database Migrations & Rollback (Flyway)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sql/**'
  push:
    branches:
      - main
    paths:
      - 'sql/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'migrate'
        type: choice
        options:
          - migrate
          - rollback
      target_version:
        description: 'Target Version for Rollback (e.g., "1")'
        required: false
        default: ''
        type: string

env:
  FLYWAY_URL: "jdbc:postgresql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}?sslmode=require"
  FLYWAY_USER: "${{ secrets.DB_USER }}"
  FLYWAY_PASSWORD: "${{ secrets.DB_PASSWORD }}"
  FLYWAY_LOCATIONS: "filesystem:${{ github.workspace }}/sql"
  FLYWAY_LICENSE_KEY: "${{ secrets.FLYWAY_LICENSE_KEY }}"
  SLACK_WEBHOOK_URL: "${{ secrets.SLACK_WEBHOOK_URL }}"

jobs:
  sql-lint-and-scan:
    name: Lint & Security Scan SQL (SQLFluff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLFluff
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff

      - name: Run SQLFluff Lint
        run: |
          sqlfluff lint sql/ --dialect postgres

  apply-migrations:
    name: Apply Migrations (Push / Workflow Dispatch)
    needs: sql-lint-and-scan
    if: |
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'migrate'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Flyway Migrate
        id: migrate
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/sql:/flyway/sql \
            flyway/flyway:9.22.3 \
            -url="${{ env.FLYWAY_URL }}" \
            -user="${{ env.FLYWAY_USER }}" \
            -password="${{ env.FLYWAY_PASSWORD }}" \
            -licenseKey="${{ env.FLYWAY_LICENSE_KEY }}" \
            migrate

      - name: Notify Slack on Migration Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🟢 *Flyway Migration Succeeded*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🟢 Flyway Migration Succeeded",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Database:*\n${{ secrets.DB_NAME }}" },
                    { "type": "mrkdwn", "text": "*Triggered By:*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}\vert{}${{ github.sha }}>" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  on-failure-undo:
    name: Automated Rollback on Migration Failure
    needs: apply-migrations
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Slack on Migration Failure (Triggering Rollback)
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *Flyway Migration Failed - Initiating Automated Rollback*",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🚨 Migration Failed: Triggering Rollback", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Database:*\n${{ secrets.DB_NAME }}" },
                    { "type": "mrkdwn", "text": "*Triggered By:*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Status:*\nExecuting `flyway undo`" }
                  ]
                }
              ]
            }

      - name: Execute Flyway Undo (Rollback Last Applied Migration)
        id: undo
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/sql:/flyway/sql \
            flyway/flyway:9.22.3 \
            -url="${{ env.FLYWAY_URL }}" \
            -user="${{ env.FLYWAY_USER }}" \
            -password="${{ env.FLYWAY_PASSWORD }}" \
            -licenseKey="${{ env.FLYWAY_LICENSE_KEY }}" \
            undo

      - name: Notify Slack on Rollback Completion
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ steps.undo.outcome == 'success' && '⚠️ *Automated Rollback Completed Successfully*' || '💥 *Automated Rollback FAILED*' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.undo.outcome == 'success' && '⚠️ Rollback Completed' || '💥 Rollback FAILED' }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Database:*\n${{ secrets.DB_NAME }}" },
                    { "type": "mrkdwn", "text": "*Rollback Outcome:*\n${{ steps.undo.outcome }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Action Logs" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  manual-rollback:
    name: Manual Rollback (Workflow Dispatch)
    needs: sql-lint-and-scan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Targeted Flyway Undo
        id: manual_undo
        run: |
          TARGET_FLAG=""
          if [ -n "${{ github.event.inputs.target_version }}" ]; then
            TARGET_FLAG="-target=${{ github.event.inputs.target_version }}"
          fi

          docker run --rm \
            -v ${{ github.workspace }}/sql:/flyway/sql \
            flyway/flyway:9.22.3 \
            -url="${{ env.FLYWAY_URL }}" \
            -user="${{ env.FLYWAY_USER }}" \
            -password="${{ env.FLYWAY_PASSWORD }}" \
            -licenseKey="${{ env.FLYWAY_LICENSE_KEY }}" \
            $TARGET_FLAG \
            undo

      - name: Notify Slack on Manual Rollback Result
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ steps.manual_undo.outcome == 'success' && '🔄 *Manual Rollback Completed*' || '🚨 *Manual Rollback FAILED*' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.manual_undo.outcome == 'success' && '🔄 Manual Rollback Completed' || '🚨 Manual Rollback FAILED' }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Database:*\n${{ secrets.DB_NAME }}" },
                    { "type": "mrkdwn", "text": "*Initiated By:*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Target Version:*\n${{ github.event.inputs.target_version || 'Latest Version' }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Logs" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
