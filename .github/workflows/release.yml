name: Production Release & Docker Publish

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on semantic tags like v2.0.0, v2.1.0-rc1

permissions:
  contents: write    # Required to create GitHub Releases & tag notes
  packages: write    # Required to publish Docker images to GHCR
  id-token: write    # Required for OIDC authentication if signing images

jobs:
  # =====================================================================
  # Job 1: Build & Publish Multi-Architecture Docker Container Images
  # =====================================================================
  publish-docker-image:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================================
  # Job 2: Generate GitHub Release & Changelog
  # =====================================================================
  create-github-release:
    name: Create GitHub Release & Auto-Changelog
    needs: publish-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history for automated release notes

      - name: Package Helm Chart Artifacts (Optional)
        id: helm-package
        run: |
          if [ -d "helm/loan-risk-engine" ]; then
            mkdir -p dist
            tar -czvf dist/helm-chart-${{ github.ref_name }}.tgz -C helm/ loan-risk-engine
            echo "HELM_EXISTS=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with Auto-Changelog
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            ${{ steps.helm-package.outputs.HELM_EXISTS == 'true' && 'dist/*.tgz' || '' }}
          body: |
            ## 🚀 What's Changed in ${{ github.ref_name }}

            ### 📦 Container Registry Image
            Pull the production-ready Docker image directly from GHCR:
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ### ☸️ Helm Installation
            ```bash
            helm upgrade --install loan-risk-engine ./helm/loan-risk-engine \
              --set image.repository=ghcr.io/${{ github.repository }} \
              --set image.tag=${{ github.ref_name }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
