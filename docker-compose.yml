version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan_risk_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:secure_password@db:5432/loan_risk_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - db
      - kafka
    networks:
      - enterprise_network

  db:
    image: postgres:15-alpine
    container_name: loan_risk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: loan_risk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: loan_risk_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - enterprise_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: loan_risk_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - enterprise_network

volumes:
  postgres_data:

networks:
  enterprise_network:
    driver: bridge
