[databases]
; Syntax: dbname = host=HOST port=PORT dbname=DBNAME
; Connection routing for the credit risk database
credit_risk_db = host=127.0.0.1 port=5432 dbname=credit_risk_db auth_user=pgbouncer

; Wildcard fallback to direct all other database requests to localhost
* = host=127.0.0.1 port=5432

[pgbouncer]
;; -----------------------------------------------------------------------------
;; Administrative & Network Settings
;; -----------------------------------------------------------------------------
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; User permitted to execute administrative SHOW/RECONFIG commands on PgBouncer
admin_users = postgres, pgbouncer
stats_users = monitoring, prometheus

;; -----------------------------------------------------------------------------
;; Pooling Mode & Limits
;; -----------------------------------------------------------------------------
; Options: session, transaction, statement
; transaction mode is recommended for Web APIs/microservices to maximize pool reuse
pool_mode = transaction

; Maximum total server connections allowed across all pools to PostgreSQL
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5

;; -----------------------------------------------------------------------------
;; Connection Lifecycle & Timeouts
;; -----------------------------------------------------------------------------
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0
query_timeout = 30
max_db_connections = 200

;; -----------------------------------------------------------------------------
;; Low-Level & TCP Settings
;; -----------------------------------------------------------------------------
pkt_buf = 4096
max_packet_size = 2147483647
listen_backlog = 128
ignore_startup_parameters = extra_float_digits, application_name, search_path
